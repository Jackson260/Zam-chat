<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zam Chat</title>
    <style>
        /* CSS STYLES */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
        
        /* Auth Screen */
        #auth-screen { padding: 20px; text-align: center; margin-top: 50px; }
        input { padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; width: 80%; }
        button { padding: 12px 24px; border: none; background: #0084ff; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Main Layout */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        header { background: white; padding: 10px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        
        /* Messenger Lite Style Chat */
        #chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background: white; }
        .message { max-width: 75%; padding: 10px; margin: 5px 0; border-radius: 15px; font-size: 15px; word-wrap: break-word; position: relative; }
        .sent { align-self: flex-end; background: #0084ff; color: white; border-bottom-right-radius: 2px; }
        .received { align-self: flex-start; background: #e4e6eb; color: black; border-bottom-left-radius: 2px; }
        
        /* Media Display */
        .media-content { width: 100%; border-radius: 10px; margin-top: 5px; cursor: pointer; }
        
        /* Input Area */
        .input-box { padding: 10px; background: white; border-top: 1px solid #ddd; display: flex; align-items: center; }
        .input-box input[type="text"] { flex: 1; margin: 0 10px; border-radius: 20px; padding: 10px; background: #f0f2f5; border: none; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h1>Zam Chat</h1>
        <div id="phone-input-section">
            <input type="tel" id="phoneNumber" placeholder="+1234567890">
            <div id="recaptcha-container"></div>
            <button onclick="onSignInSubmit()">Get Verification Code</button>
        </div>
        <div id="otp-input-section" style="display:none;">
            <input type="text" id="verificationCode" placeholder="6-digit OTP">
            <button onclick="onVerifyCodeSubmit()">Verify & Enter</button>
        </div>
    </div>

    <div id="main-app">
        <header>
            <b id="user-display-name">Zam Chat</b>
            <span id="user-zam-id" style="font-size: 12px; color: gray;"></span>
        </header>

        <div id="chat-area">
            </div>

        <div class="input-box">
            <input type="file" id="file-picker" style="display:none" onchange="handleFileUpload(this)">
            <button onclick="document.getElementById('file-picker').click()">📎</button>
            <input type="text" id="message-input" placeholder="Aa">
            <button onclick="sendTextMessage()">Send</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <script>
        // --- 1. CONFIGURATION ---
        // Your actual Firebase config keys are now integrated!
        const firebaseConfig = {
            apiKey: "AIzaSyDn7vbuGjPvfky9q22Tg5mvMlN9kpRmYK0",
            authDomain: "zam-chat-ea503.firebaseapp.com",
            projectId: "zam-chat-ea503",
            storageBucket: "zam-chat-ea503.firebasestorage.app",
            messagingSenderId: "472497914873",
            appId: "1:472497914873:web:9779c6b18936f4819d3328",
            measurementId: "G-0FVLKP9KF9" // Including Google Analytics measurement ID
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // --- 2. ZAM ID LOGIC ---
        // Generates a random number with 2 to 6 digits
        function generateZamID() {
            const digits = Math.floor(Math.random() * (6 - 2 + 1)) + 2; 
            const min = Math.pow(10, digits - 1);
            const max = Math.pow(10, digits) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // --- 3. AUTHENTICATION LOGIC ---
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container');

        function onSignInSubmit() {
            const num = document.getElementById('phoneNumber').value;
            auth.signInWithPhoneNumber(num, window.recaptchaVerifier)
                .then(confirmationResult => {
                    window.confirmationResult = confirmationResult;
                    document.getElementById('phone-input-section').style.display = 'none';
                    document.getElementById('otp-input-section').style.display = 'block';
                }).catch(err => alert(err.message));
        }

        function onVerifyCodeSubmit() {
            const code = document.getElementById('verificationCode').value;
            window.confirmationResult.confirm(code).then(result => {
                const user = result.user;
                checkUserProfile(user);
            }).catch(err => alert("Wrong Code!"));
        }

        function checkUserProfile(user) {
            const userRef = db.collection('users').doc(user.uid);
            userRef.get().then(doc => {
                if (!doc.exists) {
                    const newID = generateZamID();
                    userRef.set({ zamId: newID, phone: user.phoneNumber });
                }
                showApp(user);
            });
        }

        function showApp(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            // Set user display name and Zam ID in the header
            document.getElementById('user-display-name').innerText = user.displayName || user.phoneNumber || "Zam Chat User";
            db.collection('users').doc(user.uid).get().then(doc => {
                if (doc.exists && doc.data().zamId) {
                    document.getElementById('user-zam-id').innerText = `ID: ${doc.data().zamId}`;
                }
            });
            loadMessages();
        }

        // --- 4. MESSAGING LOGIC ---
        function sendTextMessage() {
            const text = document.getElementById('message-input').value;
            if (!text) return;

            db.collection('messages').add({
                text: text,
                sender: auth.currentUser.uid,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                type: 'text'
            });
            document.getElementById('message-input').value = "";
        }

        async function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const storageRef = storage.ref(`uploads/${Date.now()}_${file.name}`);
            const snapshot = await storageRef.put(file);
            const url = await snapshot.ref.getDownloadURL();

            db.collection('messages').add({
                fileUrl: url,
                fileName: file.name,
                fileType: file.type, // image, video, audio, etc.
                sender: auth.currentUser.uid,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                type: 'file'
            });
        }

        function loadMessages() {
            db.collection('messages').orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    const chatArea = document.getElementById('chat-area');
                    chatArea.innerHTML = "";
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const isMe = data.sender === auth.currentUser.uid;
                        const msgDiv = document.createElement('div');
                        msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;
                        
                        if(data.type === 'text') {
                            msgDiv.innerText = data.text;
                        } else {
                            // Handle Media
                            if(data.fileType && data.fileType.includes('image')) {
                                msgDiv.innerHTML = `<img src="${data.fileUrl}" class="media-content">`;
                            } else if(data.fileType && data.fileType.includes('video')) {
                                msgDiv.innerHTML = `<video controls class="media-content"><source src="${data.fileUrl}"></video>`;
                            } else if(data.fileType && data.fileType.includes('audio')) {
                                msgDiv.innerHTML = `<audio controls style="width:100%"><source src="${data.fileUrl}"></audio>`;
                            } else {
                                // Documents
                                msgDiv.innerHTML = `<a href="${data.fileUrl}" download style="color:inherit">📄 ${data.fileName}</a>`;
                            }
                        }
                        chatArea.appendChild(msgDiv);
                    });
                    chatArea.scrollTop = chatArea.scrollHeight;
                });
        }
    </script>
</body>
</html>
